name: Test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cardbot
          POSTGRES_PASSWORD: cardbot
          POSTGRES_DB: cardbot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cardbot" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Test (SQLite)
        run: pytest -q
      - name: Test outbox e migrazioni su Postgres
        env:
          TEST_DATABASE_URL: postgresql://cardbot:cardbot@localhost:5432/cardbot_test
          DATABASE_URL: postgresql://cardbot:cardbot@localhost:5432/cardbot_test
        run: |
          pytest -q tests/test_outbox.py
          alembic upgrade head && alembic downgrade base
